# Nginx Rate Limiting Configuration for TherapEase
# Add this to your nginx configuration file

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=strict:10m rate=2r/s;

# Block known bot user agents
map $http_user_agent $block_bot {
    default 0;
    ~*Go-http-client 1;  # Block Go HTTP client bots
    ~*bot 1;            # Block common bots
    ~*crawler 1;        # Block crawlers
    ~*spider 1;         # Block spiders
    ~*scraper 1;        # Block scrapers
    ~*curl 1;           # Block curl (unless legitimate)
    ~*wget 1;            # Block wget
    ~*python-requests 1; # Block Python requests
    ~*java 1;            # Block Java HTTP clients
    ~*httpclient 1;     # Block HTTP clients
    "" 1;                # Block empty user agents
}

# Block bad IPs
geo $block_ip {
    default 0;
    # Add known bad IPs here if needed
    # 103.203.135.149 1;
    # 45.41.106.192 1;
}

# Main server block rate limiting
server {
    # ... existing server configuration ...
    
    # Block bots and bad IPs
    if ($block_bot) {
        return 403;
    }
    
    if ($block_ip) {
        return 403;
    }
    
    # Rate limiting for general requests
    location / {
        limit_req zone=general burst=20 nodelay;
        # ... existing location configuration ...
    }
    
    # Rate limiting for API requests
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        # ... existing API proxy configuration ...
    }
    
    # Strict rate limiting for maintenance-status (reduce polling impact)
    location /api/maintenance-status {
        limit_req zone=strict burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000/api/maintenance-status;
        # ... existing proxy configuration ...
    }
    
    # ... rest of server configuration ...
}

