name: therapease
services:
- name: api
  source_dir: /server
  github:
    repo: your-username/therapease
    branch: main
  run_command: npm start
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  envs:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "5000"
  - key: DB_HOST
    value: ${db.HOSTNAME}
  - key: DB_USER
    value: ${db.USERNAME}
  - key: DB_PASSWORD
    value: ${db.PASSWORD}
  - key: DB_NAME
    value: ${db.DATABASE}
  - key: DB_PORT
    value: "25060"
  - key: JWT_SECRET
    value: ${JWT_SECRET}
  - key: ENCRYPTION_KEY
    value: ${ENCRYPTION_KEY}
  - key: SESSION_SECRET
    value: ${SESSION_SECRET}
  - key: CORS_ORIGIN
    value: https://therapease-frontend.ondigitalocean.app
  - key: API_BASE_URL
    value: https://therapease-api.ondigitalocean.app
  - key: REACT_APP_API_URL
    value: https://therapease-api.ondigitalocean.app
  - key: SSL_ENABLED
    value: "true"
  - key: EMAIL_ENABLED
    value: "false"
  - key: SMS_ENABLED
    value: "false"
  - key: OPENAI_API_KEY
    value: ${OPENAI_API_KEY}
  - key: VAPID_PUBLIC_KEY
    value: ${VAPID_PUBLIC_KEY}
  - key: VAPID_PRIVATE_KEY
    value: ${VAPID_PRIVATE_KEY}
  - key: VAPID_SUBJECT
    value: mailto:admin@therapease.com
  - key: ADMIN_EMAIL
    value: admin@therapease.com
  - key: ADMIN_PASSWORD
    value: SecureAdmin2024!@#$

- name: frontend
  source_dir: /client
  github:
    repo: your-username/therapease
    branch: main
  build_command: npm run build
  run_command: npm run preview
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  envs:
  - key: REACT_APP_API_URL
    value: https://therapease-api.ondigitalocean.app
  - key: REACT_APP_VAPID_PUBLIC_KEY
    value: ${VAPID_PUBLIC_KEY}

- name: public-website
  source_dir: /public-website
  github:
    repo: your-username/therapease
    branch: main
  run_command: node server.js
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  envs:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "8080"

databases:
- name: db
  engine: MYSQL
  version: "8"
  size: db-s-1vcpu-1gb
  num_nodes: 1
