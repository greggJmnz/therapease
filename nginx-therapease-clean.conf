# 🌐 TherapEase Nginx Configuration for Contabo
# Clean, working configuration with bot blocking

# Block known bot user agents (less aggressive - only blocks actual bots)
# Removed: curl, wget, python-requests, java, httpclient to avoid blocking legitimate tools
map $http_user_agent $block_bot {
    default 0;
    ~*(?i)bot 1;            # Block common bots
    ~*(?i)crawler 1;        # Block crawlers
    ~*(?i)spider 1;         # Block spiders
    ~*(?i)scraper 1;        # Block scrapers
    ~*(?i)AhrefsBot 1;      # Block Ahrefs bot
    ~*(?i)SemrushBot 1;     # Block Semrush bot
    ~*(?i)MJ12bot 1;        # Block MJ12 bot
    ~*Go-http-client 1;     # Block ALL Go HTTP client bots (aggressive - these are attackers)
    "" 1;                    # Block empty user agents
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=strict:10m rate=2r/s;

# HTTP to HTTPS redirect for API
server {
    listen 80;
    server_name api.therapease.site;
    return 301 https://$host$request_uri;
}

# API Server (Port 5000) - https://api.therapease.site
server {
    listen 443 ssl http2;
    server_name api.therapease.site;

    # IMPORTANT: No root directive here - all requests should be proxied to Node.js
    # This prevents Nginx from trying to serve files directly

    # Set upload size limit at server level (applies to all locations)
    # This ensures file uploads work even if location block doesn't match
    # IMPORTANT: This must be set BEFORE any location blocks
    client_max_body_size 100M;
    client_body_buffer_size 256k;
    client_body_timeout 300s;
    
    # Explicitly set root to prevent Nginx from trying to serve files directly
    # This ensures all requests are proxied to Node.js
    root /dev/null;
    
    # Handle 413 errors at server level with CORS headers
    # This ensures CORS headers are added even if error occurs before location matching
    error_page 413 = @cors_413;

    # Block bots at server level (before location blocks)
    # This catches requests without Host headers that would otherwise cause 400 errors
    if ($block_bot) {
        return 403;
    }

    # SSL Configuration (added by Certbot)
    ssl_certificate /etc/letsencrypt/live/therapease.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/therapease.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Block common vulnerability scanner paths BEFORE they hit the backend
    # Return 444 (close connection) for efficiency - no response sent
    location ~ /\.(env|git|svn|hg|bzr) {
        access_log off;
        log_not_found off;
        return 444;
    }

    location ~ \.(env|bak|backup|old|orig|original|save|swp|tmp)$ {
        access_log off;
        log_not_found off;
        return 444;
    }

    location ~ /(wp-config|config\.json|config\.js|aws-config|aws\.config|\.gitlab-ci|\.git/logs) {
        access_log off;
        log_not_found off;
        return 444;
    }

    location ~ /(admin|core|vendor|node_modules|\.git)/.*\.(env|php|json|js|yml|yaml)$ {
        access_log off;
        log_not_found off;
        return 444;
    }

    # Gzip compression for API responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Note: client_max_body_size is set at the top of this server block (line 41)
    # This ensures file uploads work for all locations

    # Serve uploaded files (exercise proofs, etc.) with CORS headers
    # MUST be before /api/ location to ensure it matches first
    # Use ^~ modifier to prevent other location blocks from matching
    location ^~ /uploads/ {
        # Explicitly disable root to prevent Nginx from trying to serve files directly
        root /dev/null;
        
        # Handle OPTIONS preflight for CORS
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain';
            return 204;
        }
        
        # Proxy to backend Node.js server
        # The trailing slash in location and proxy_pass ensures proper path handling
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Add CORS headers for GET requests
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        
        # Cache control for images
        if ($uri ~* \.(png|jpg|jpeg|gif|webp|bmp|svg)$) {
            add_header Cache-Control "public, max-age=31536000" always;
            expires 1y;
        }
        
        # Timeout settings
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Redirect /uploads to /uploads/ (without trailing slash)
    location = /uploads {
        return 301 /uploads/;
    }

    # Rate limiting for API
    location /api/ {
        # Block bots FIRST (before OPTIONS handling)
        if ($block_bot) {
            access_log off;
            return 403;
        }
        
        # Note: client_max_body_size and error_page 413 are set at server level
        # This location inherits the 100M limit and CORS error handling
        
        # Add CORS headers for successful responses
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-Data-Protection, X-Content-Encryption' always;
        
        # Handle OPTIONS preflight FIRST (before rate limiting)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain';
            return 204;
        }
        
        # Then apply rate limiting for other requests
        limit_req zone=api burst=30 nodelay;
        
        # Proxy to backend
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Performance optimizations
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Timeout optimizations (increased for large file uploads)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;  # 5 minutes for large uploads
        proxy_read_timeout 300s;  # 5 minutes for large uploads
    }
    
    # Custom error handler for 413 with CORS headers
    # This location handles 413 errors and adds CORS headers
    location @cors_413 {
        # Internal redirect - don't proxy, just return response
        internal;
        
        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-Data-Protection, X-Content-Encryption' always;
        add_header 'Content-Type' 'application/json' always;
        
        # Return JSON error response
        return 413 '{"error": "File too large. Maximum file size is 100MB.", "code": "FILE_TOO_LARGE"}';
    }

    # Strict rate limiting for maintenance-status
    location /api/maintenance-status {
        limit_req zone=strict burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000/api/maintenance-status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stricter rate limiting for login endpoints
    location /api/auth/login {
        limit_req zone=strict burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint (no rate limiting)
    location /api/health {
        proxy_pass http://127.0.0.1:5000/api/health;
        access_log off;
    }

    # WebSocket support for API subdomain
    location /ws {
        proxy_pass http://127.0.0.1:5000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Catch-all: Proxy all other requests to Node.js server
    # This ensures that any request not matching above locations is proxied
    # Prevents Nginx from trying to serve files directly from default root
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

# HTTP to HTTPS redirect for Frontend
# Block requests without Host header (bots attacking IP directly)
server {
    listen 80 default_server;
    server_name _;  # Catch-all for invalid Host headers
    
    # Block requests without Host header (bots attacking IP directly)
    # These requests cause 400 errors and waste resources
    if ($host = "") {
        return 444;  # Close connection without response (more efficient than 400)
    }
    
    # If Host header is present but doesn't match, redirect to HTTPS
    if ($host ~* ^(therapease\.site|www\.therapease\.site)$) {
        return 301 https://$host$request_uri;
    }
    
    # For all other cases, return 444 (close connection)
    return 444;
}

# Frontend (Static Files) - https://therapease.site
server {
    listen 443 ssl http2;
    server_name therapease.site www.therapease.site;

    # Block requests without Host header (bots attacking IP directly)
    if ($host = "") {
        access_log off;
        return 444;  # Close connection without response
    }
    
    # Block bots at server level (before location blocks)
    # This catches requests without Host headers that would otherwise cause 400 errors
    if ($block_bot) {
        access_log off;
        return 403;
    }

    # SSL Configuration (added by Certbot)
    ssl_certificate /etc/letsencrypt/live/therapease.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/therapease.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Block common vulnerability scanner paths BEFORE they hit the backend
    # Return 444 (close connection) for efficiency - no response sent
    location ~ /\.(env|git|svn|hg|bzr) {
        access_log off;
        log_not_found off;
        return 444;
    }

    location ~ \.(env|bak|backup|old|orig|original|save|swp|tmp)$ {
        access_log off;
        log_not_found off;
        return 444;
    }

    location ~ /(wp-config|config\.json|config\.js|aws-config|aws\.config|\.gitlab-ci|\.git/logs) {
        access_log off;
        log_not_found off;
        return 444;
    }

    location ~ /(admin|core|vendor|node_modules|\.git)/.*\.(env|php|json|js|yml|yaml)$ {
        access_log off;
        log_not_found off;
        return 444;
    }

    # IMPORTANT: Build output directory - check if dist or build exists
    # If build exists, use it; otherwise use dist (Vite default)
    root /home/therapease_user/therapease/client/build;
    index index.html;

    # Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_min_length 1000;
    gzip_disable "msie6";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Public website - proxy to API server (must be before catch-all location /)
    location /public-website/ {
        proxy_pass http://127.0.0.1:5000/public-website/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Redirect /public-website to /public-website/ (without trailing slash)
    location = /public-website {
        return 301 /public-website/;
    }

    # Static assets with long-term caching (Vite uses /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Main application - SPA routing
    location / {
        # Block bots FIRST (before rate limiting)
        if ($block_bot) {
            return 403;
        }
        
        # Rate limiting
        limit_req zone=general burst=20 nodelay;
        
        try_files $uri $uri/ /index.html;
        
        # Cache control for HTML files
        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public, no-cache";
        }
    }
    
    # Note: API and WebSocket endpoints removed from frontend server
    # Frontend should use https://api.therapease.site for all API calls
    # This avoids CORS issues and simplifies security configuration
}

# Public Website - http://www.therapease.site:8080 (if needed)
server {
    listen 8080;
    server_name www.therapease.site;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

